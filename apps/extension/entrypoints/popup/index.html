<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Carat</title>
    <style>
      :root {
        --base: #1e1e2e;
        --mantle: #181825;
        --surface0: #313244;
        --surface1: #45475a;
        --text: #cdd6f4;
        --subtext0: #a6adc8;
        --blue: #89b4fa;
        --teal: #94e2d5;
        --green: #a6e3a1;
        --peach: #fab387;
        --mauve: #cba6f7;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        background: var(--base);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--surface0);
      }
      header h1 { font-size: 14px; font-weight: 600; margin: 0; }
      header .spacer { flex: 1; }
      .toggle { display: flex; align-items: center; gap: 6px; color: var(--subtext0); cursor: pointer; }
      .toggle input { width: 14px; height: 14px; margin: 0; accent-color: var(--blue); }
      .site { padding: 6px 12px; border-bottom: 1px solid var(--surface0); font-size: 12px; }
      .site[hidden] { display: none; }
      #site-host { color: var(--text); }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 10px 12px 0;
      }
      .tab {
        padding: 6px 8px;
        border: 1px solid var(--surface0);
        background: var(--mantle);
        color: var(--subtext0);
        border-radius: 7px;
      }
      .tab[aria-selected="true"] {
        border-color: var(--blue);
        color: var(--text);
        background: color-mix(in srgb, var(--blue) 18%, var(--surface0));
      }
      .panel { display: none; }
      .panel.active { display: block; }
      #clear { width: calc(100% - 24px); margin: 10px 12px 0; padding: 6px 10px; font-size: 12px; }
      #clear[data-state="working"] { color: var(--subtext0); }
      #clear[data-state="done"] { border-color: var(--teal); color: var(--teal); }
      #model {
        margin: 10px 0 0;
        padding: 6px 12px;
        border-top: 1px solid var(--surface0);
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--subtext0);
        overflow-wrap: anywhere;
      }
      .analytics {
        padding: 10px 12px 0;
        display: grid;
        gap: 10px;
      }
      .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .metric {
        border: 1px solid var(--surface0);
        background: var(--mantle);
        border-radius: 8px;
        padding: 8px;
      }
      .metric b { display: block; font-size: 18px; line-height: 1.1; }
      .metric span { display: block; margin-top: 3px; font-size: 10px; color: var(--subtext0); }
      .bars, .facts, .recent { display: grid; gap: 7px; }
      .bar-row { display: grid; gap: 4px; }
      .bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--subtext0); }
      .bar-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { height: 7px; border-radius: 999px; background: var(--surface0); overflow: hidden; }
      .bar-fill { display: block; height: 100%; border-radius: inherit; background: var(--green); }
      .fact, .recent-row {
        border: 1px solid var(--surface0);
        background: color-mix(in srgb, var(--surface0) 58%, transparent);
        border-radius: 8px;
        padding: 8px;
      }
      .fact { color: var(--text); font-size: 12px; }
      .recent-row { display: grid; gap: 3px; font-size: 11px; }
      .recent-row b { font-size: 12px; font-weight: 600; }
      .recent-row span { color: var(--subtext0); }
      .outcome-accepted { color: var(--green); }
      .outcome-dismissed { color: var(--peach); }
      .outcome-alternative { color: var(--mauve); }
      .empty { color: var(--subtext0); font-size: 12px; text-align: center; padding: 12px 4px; }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-top: 1px solid var(--surface0);
        color: var(--subtext0);
      }
      footer a { color: var(--blue); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      button {
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--surface1);
        background: var(--surface0);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      #offline { display: none; padding: 20px 12px; text-align: center; color: var(--subtext0); }
      #offline p { margin: 0 0 10px; }
      main[data-state="offline"] #offline { display: block; }
      main[data-state="offline"] #clear,
      main[data-state="offline"] #model,
      main[data-state="offline"] .tabs,
      main[data-state="offline"] .panel,
      main[data-state="offline"] .site,
      main[data-state="offline"] footer { display: none; }
    </style>
  </head>
  <body>
    <main id="app" data-state="loading">
      <header>
        <h1>Carat</h1>
        <span class="spacer"></span>
        <label class="toggle">
          <input type="checkbox" id="enabled" />
          <span>Enabled</span>
        </label>
      </header>

      <div id="offline">
        <p>Carat's background worker is not answering.</p>
        <button type="button" id="retry">Retry</button>
      </div>

      <div class="tabs" role="tablist" aria-label="Carat popup">
        <button class="tab" type="button" role="tab" id="tab-home" aria-controls="panel-home" aria-selected="true">Control</button>
        <button class="tab" type="button" role="tab" id="tab-analytics" aria-controls="panel-analytics" aria-selected="false">Analytics</button>
      </div>

      <section class="panel active" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
        <label class="toggle site" id="site-row" hidden>
          <input type="checkbox" id="site-enabled" />
          <span>On for <span id="site-host"></span></span>
        </label>

        <button type="button" id="clear" data-state="idle">Clear what carat remembers</button>

        <p id="model"></p>
      </section>

      <section class="panel" id="panel-analytics" role="tabpanel" aria-labelledby="tab-analytics">
        <div class="analytics" id="analytics">
          <div class="empty">Loading analytics…</div>
        </div>
      </section>

      <footer>
        <a href="#" id="options">Settings</a>
        <span>Right Shift accepts · Esc dismisses</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
